<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Echo Show Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .widget {
      margin: 20px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <h1>My Dashboard</h1>

  <div class="widget">
    <h2>🕒 Clock</h2>
    <p id="clock"></p>
  </div>

  <div class="widget">
    <h2>☀️ Weather (Manual)</h2>
    <p>Sunny, 28°C</p>
  </div>

  <div class="widget">
    <h2>📝 Notes</h2>
    <p>Don’t forget to feed the cat 🐱</p>
  </div>
