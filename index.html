<!DOCTYPE html>
<html>
<head>
  <title>Echo Show Dashboard</title>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #topbar {
      background: #222;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 10px 15px;
      background: #444;
      border: none;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover {
      background: #666;
    }
    iframe {
      width: 100%;
      height: 87vh;
      border: none;
      background: #fff;
    }
  </style>
  <script>
    // 🔄 Keep Silk alive
    setInterval(() => {
      console.log("Keeping Silk alive...");
    }, 20000);

    // Switch iframe site
    function loadSite(url) {
      document.getElementById("browserFrame").src = url;
    }
  </script>
</head>
<body>
  <div id="topbar">
    <button onclick="loadSite('https://www.google.com')">Google</button>
    <button onclick="loadSite('https://www.youtube.com')">YouTube</button>
    <button onclick="loadSite('https://www.reddit.com')">Reddit</button>
    <button onclick="loadSite('https://chat.openai.com')">ChatGPT</button>
  </div>

  <iframe id="browserFrame" src="https://www.google.com"></iframe>
</body>
</html>
